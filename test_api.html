<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavenly API Diagnostics</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #fff5f0; color: #4a2c3a; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 600px; margin: auto; }
        .status { padding: 10px; border-radius: 10px; margin: 20px 0; font-weight: bold; text-align: center; }
        .online { background: #dcfce7; color: #166534; }
        .offline { background: #fee2e2; color: #991b1b; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 10px; overflow-x: auto; font-size: 12px; }
        button { background: #e8a598; border: none; color: white; padding: 12px 24px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔍 API Diagnostic Tool</h1>
        <p>Testing connection to: <code>http://localhost:5000</code></p>

        <button onclick="testAPI()">Run Test Now</button>

        <div id="statusBox" class="status" style="display:none"></div>

        <h3>Response Data:</h3>
        <pre id="output">Results will appear here...</pre>

        <h3>Checklist:</h3>
        <ul>
            <li>Is the Python terminal running?</li>
            <li>Does it say "Uvicorn running on http://0.0.0.0:5000"?</li>
            <li>Try opening <a href="http://localhost:5000/docs" target="_blank">http://localhost:5000/docs</a></li>
        </ul>
    </div>

    <script>
        async function testAPI() {
            const output = document.getElementById('output');
            const statusBox = document.getElementById('statusBox');
            statusBox.style.display = 'block';
            statusBox.innerText = '⌛ Testing...';
            statusBox.className = 'status';

            try {
                const response = await fetch('http://localhost:5000/health');
                const data = await response.json();

                statusBox.className = 'status online';
                statusBox.innerText = '✅ BACKEND IS ONLINE!';
                output.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                statusBox.className = 'status offline';
                statusBox.innerText = '❌ BACKEND IS OFFLINE';
                output.innerText = 'ERROR: ' + err.message + '\n\nPossible cause: Backend is not running or CORS is blocking the request.';
            }
        }
    </script>
</body>
</html>
